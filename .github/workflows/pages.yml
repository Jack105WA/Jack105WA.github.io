name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate latest commit metadata and changelog fallback
        run: |
          python3 <<'PY'
          import datetime
          import json
          import subprocess

          latest_date = subprocess.check_output(
              ["git", "log", "-1", "--format=%cI"], text=True
          ).strip()
          latest_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          with open("Website/last-updated.json", "w", encoding="utf-8") as file:
              json.dump({"commitDate": latest_date, "commit": latest_sha}, file)

          rows = subprocess.check_output(
              ["git", "log", "-100", "--format=%H%x1f%aI%x1f%an%x1f%s"],
              text=True
          ).splitlines()
          commits = []
          for row in rows:
              parts = row.split("\x1f", 3)
              if len(parts) != 4:
                  continue
              sha, date, author, subject = parts
              commits.append({
                  "sha": sha,
                  "html_url": f"https://github.com/Jack105WA/Jack105WA.github.io/commit/{sha}",
                  "commit": {
                      "author": {"name": author, "date": date},
                      "committer": {"name": author, "date": date},
                      "message": subject
                  }
              })

          with open("Website/updates/changelog-fallback.json", "w", encoding="utf-8") as file:
              json.dump(commits, file, ensure_ascii=False, indent=2)
              file.write("\n")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
