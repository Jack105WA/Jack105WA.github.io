name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source
          fetch-depth: 1

      - name: Add beta website under /beta
        run: |
          test -d beta-source/Website
          mkdir -p Website/beta
          cp -a beta-source/Website/. Website/beta/
          rm -rf beta-source

          python3 <<'PY'
          from pathlib import Path
          import re

          beta = Path("Website/beta")
          text_extensions = {
              ".html", ".htm", ".css", ".js", ".mjs", ".json",
              ".xml", ".txt", ".svg", ".webmanifest"
          }

          for path in beta.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_extensions:
                  continue

              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              # Prefix root-relative URLs so the beta copy loads its own
              # assets and keeps navigation inside /beta.
              content = re.sub(
                  r'(["\'\x60])/(?!/|beta/)',
                  r'\1/beta/',
                  content
              )
              content = re.sub(
                  r'url\(\s*/(?!/|beta/)',
                  'url(/beta/',
                  content,
                  flags=re.IGNORECASE
              )

              # Ensure any ordinary relative links resolve from /beta/.
              content = re.sub(
                  r'(<head(?:\s[^>]*)?>)',
                  r'\1\n    <base href="/beta/">',
                  content,
                  count=1,
                  flags=re.IGNORECASE
              ) if path.suffix.lower() in {".html", ".htm"} else content

              path.write_text(content, encoding="utf-8")

      - name: Generate production commit metadata and changelog fallback
        run: |
          python3 <<'PY'
          import json
          import subprocess

          latest_date = subprocess.check_output(
              ["git", "log", "-1", "--format=%cI"], text=True
          ).strip()
          latest_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          with open("Website/last-updated.json", "w", encoding="utf-8") as file:
              json.dump({"commitDate": latest_date, "commit": latest_sha}, file)

          rows = subprocess.check_output(
              ["git", "log", "-100", "--format=%H%x1f%aI%x1f%an%x1f%s"],
              text=True
          ).splitlines()
          commits = []
          for row in rows:
              parts = row.split("\x1f", 3)
              if len(parts) != 4:
                  continue
              sha, date, author, subject = parts
              commits.append({
                  "sha": sha,
                  "html_url": f"https://github.com/Jack105WA/Jack105WA.github.io/commit/{sha}",
                  "commit": {
                      "author": {"name": author, "date": date},
                      "committer": {"name": author, "date": date},
                      "message": subject
                  }
              })

          with open("Website/updates/changelog-fallback.json", "w", encoding="utf-8") as file:
              json.dump(commits, file, ensure_ascii=False, indent=2)
              file.write("\n")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
