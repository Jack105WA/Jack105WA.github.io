    <link rel="stylesheet" href="/assets/css/cursors.css">
<script>
    // GitHub Pages serves this file for extensionless routes.
    // Load the matching root-level HTML file without changing the address bar.
    (() => {
        const routes = {
            "/blog": "/blog.html",
            "/admin": "/admin.html"
        };

        const target = routes[window.location.pathname.replace(/\/+$/, "")];
        if (!target) return;

        fetch(target)
            .then(response => {
                if (!response.ok) throw new Error("Page could not be loaded.");
                return response.text();
            })
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(error => console.error("Route loading failed:", error));
    })();
</script>
</head>
